[project]
name = "iimsbp-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.5",
    "uvicorn[standard]>=0.32.1",
    "python-multipart>=0.0.12",
    "pandas>=2.2.3",
    "openpyxl>=3.1.5",
    "anthropic>=0.40.0",
    "supabase>=2.10.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.10.3",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
